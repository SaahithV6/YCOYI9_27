<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Scrubline · Prompter</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0b0a09;color:#f3eee8;font-family:Inter,sans-serif}
.wrap{height:100%;display:flex;flex-direction:column;justify-content:center;padding:0 7vw}
#clock{font:600 2.2vw 'JetBrains Mono';color:#14b8a6}
#cur{font-size:3.6vw;font-weight:700;line-height:1.3;margin:3vh 0}
#next{font-size:2vw;color:#6f675f;line-height:1.35}
#bar{height:6px;background:#2a2623;border-radius:3px;margin-top:4vh;overflow:hidden}#bar i{display:block;height:100%;background:#14b8a6;width:0}
#hint{position:fixed;bottom:2vh;left:7vw;color:#6f675f;font-size:1.1vw}
</style></head><body><div class="wrap">
<div id="clock">press SPACE to start</div><div id="cur">Scrubline demo prompter</div><div id="next"></div><div id="bar"><i id="fill"></i></div></div>
<div id="hint">SPACE start/pause · ← → jump a cue · lines are timed to the recorded walkthrough</div>
<script>
let cues = [], t = 0, run = false, last = null;
fetch("/demo_cues.json").then(r => r.json()).then(c => cues = c);
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, "0")}`;
function draw() { const i = cues.findIndex(c => t >= c.start && t < c.end), c = cues[i];
  document.getElementById("clock").textContent = `${fmt(t)} / ${cues.length ? fmt(cues.at(-1).end) : "–"}${run ? "" : "  · paused"}`;
  if (c) { document.getElementById("cur").textContent = c.text; document.getElementById("next").textContent = cues[i + 1] ? "Next: " + cues[i + 1].text : "";
    document.getElementById("fill").style.width = (100 * (t - c.start) / (c.end - c.start)) + "%"; }
  else if (cues.length && t >= cues.at(-1).end) document.getElementById("cur").textContent = "Done."; }
function tick(now) { if (run) { t += (now - (last ?? now)) / 1000; last = now; draw(); } requestAnimationFrame(tick); }
requestAnimationFrame(tick);
addEventListener("keydown", e => { if (e.key === " ") { run = !run; last = null; draw(); }
  const i = cues.findIndex(c => t >= c.start && t < c.end);
  if (e.key === "ArrowRight" && cues[i + 1]) { t = cues[i + 1].start; draw(); } if (e.key === "ArrowLeft") { t = cues[Math.max(0, i - 1)].start; draw(); } });
</script></body></html>
